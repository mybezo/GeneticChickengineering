# Compressed Machine settings
# A compressed machine combines multiple machines into one.
#
# Compressed Excitation Chamber:
#   - The chicken is not consumed. The amount of chickens in the stack decides
#     how many resources are produced at once (up to the multiplier).
#   - The speed is the same as the original chamber.
#   - The energy consumption is multiplied by the amount of chickens being processed.
#   - Only the resources that fit in the output slots are produced.
#
# Recipes (Compressor):
#   x8  = 8 of the original machine
#   x16 = 2 of the x8 machine
#   x32 = 2 of the x16 machine
#   x64 = 2 of the x32 machine
#
# Only the highest enabled multiplier is listed in the guide,
# the lower multipliers are still craftable (click them in the recipe to view).
#
# Changes require a server restart.
# Missing options are added automatically, existing values are kept.

# Enable/disable all the compressed machines
enabled: true

# Enable/disable each multiplier.
# Disabling a multiplier also disables all the multipliers above it,
# because their recipes need the previous multiplier.
multipliers:
  x8: true
  x16: true
  x32: true
  x64: true

# Enable/disable the compressed versions (all multipliers) of each machine
machines:
  EXCITATION_CHAMBER: true
  EXCITATION_CHAMBER_2: true
  EXCITATION_CHAMBER_3: true
